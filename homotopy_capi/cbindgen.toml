# Generates include/homotopy_capi.h, see build.rs
language = "C"
include_guard = "HOMOTOPY_CAPI_H"
autogen_warning = "/* Generated by cbindgen from homotopy_capi, don't edit. */"
documentation_style = "c99"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h"]
no_includes = true

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
