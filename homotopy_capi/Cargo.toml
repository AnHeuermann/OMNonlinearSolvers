[package]
name = "homotopy_capi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# staticlib: linked into a C host like the OpenModelica C runtime.
# rlib: lets Rust tests and other crates use it.
crate-type = ["staticlib", "rlib"]

[dependencies]
faer.workspace = true
homotopy_core = { path = "../homotopy_core" }
log.workspace = true
newton = { path = "../newton" }
nls_model = { path = "../nls_model" }

[build-dependencies]
cbindgen = "0.29.4"

[lints]
workspace = true
